plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv('BEIBEI_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('BEIBEI_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('BEIBEI_KEY_ALIAS')
def releaseKeyPassword = System.getenv('BEIBEI_KEY_PASSWORD')

android {
    namespace 'com.codex.fx991smooth'
    compileSdk 34

    // Internal flavor naming stays unchanged for now; public app identity is Beibei Calculator.
    flavorDimensions += 'model'

    defaultConfig {
        // 0.3.15 starts the durable public install/update lineage.
        applicationId 'com.beibei.calculator'
        minSdk 26
        targetSdk 34
        versionCode 330
        versionName '0.3.16'
        buildConfigField 'String', 'MODEL_ID', '"CN991_CW"'
        buildConfigField 'String', 'MODEL_PROFILE', '"FX_991_CN_CW"'
        buildConfigField 'String', 'MODEL_LABEL', '"北北计算器"'
        buildConfigField 'boolean', 'MODEL_EXTENDED', 'false'
        buildConfigField 'boolean', 'HAS_DISTRIBUTION', 'false'
        buildConfigField 'boolean', 'HAS_SPREADSHEET', 'false'
        buildConfigField 'int', 'APPLICATION_COUNT', '10'
    }

    productFlavors {
        cn991 {
            dimension 'model'
            buildConfigField 'String', 'MODEL_ID', '"CN991_CW"'
            buildConfigField 'String', 'MODEL_PROFILE', '"FX_991_CN_CW"'
            buildConfigField 'String', 'MODEL_LABEL', '"北北计算器"'
            buildConfigField 'boolean', 'MODEL_EXTENDED', 'false'
            buildConfigField 'boolean', 'HAS_DISTRIBUTION', 'false'
            buildConfigField 'boolean', 'HAS_SPREADSHEET', 'false'
            buildConfigField 'int', 'APPLICATION_COUNT', '10'
            resValue 'string', 'app_name', '北北计算器'
            resValue 'string', 'app_model_name', '北北计算器'
        }
    }

    // Release signing is restored only from durable CI secrets. Debug signing is
    // intentionally left to Android/AGP and is never used for user-facing releases.
    signingConfigs {
        beibeiRelease {
            if (releaseKeystorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseKeystorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.beibeiRelease
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
