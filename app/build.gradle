plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codex.fx991smooth'
    compileSdk 34

    // Keep a named dimension so Gradle produces one explicit 991 variant;
    // the former 999 publication is intentionally absent from this train.
    flavorDimensions += 'model'

    defaultConfig {
        applicationId 'com.codex.cnscientific.calculator991'
        // The core intentionally targets the Android 8 Java API surface.
        // API 26 provides streams/default collection methods used by the
        // dependency-free engines without requiring a desugared JDK bundle.
        minSdk 26
        targetSdk 34
        versionCode 323
        versionName '0.3.9'
        buildConfigField 'String', 'MODEL_ID', '"CN991_CW"'
        buildConfigField 'String', 'MODEL_PROFILE', '"FX_991_CN_CW"'
        buildConfigField 'String', 'MODEL_LABEL', '"CN Scientific 991"'
        buildConfigField 'boolean', 'MODEL_EXTENDED', 'false'
        buildConfigField 'boolean', 'HAS_DISTRIBUTION', 'false'
        buildConfigField 'boolean', 'HAS_SPREADSHEET', 'false'
        buildConfigField 'int', 'APPLICATION_COUNT', '10'
    }

    productFlavors {
        cn991 {
            dimension 'model'
            // Only the requested 991 profile is published in this release.
            buildConfigField 'String', 'MODEL_ID', '"CN991_CW"'
            buildConfigField 'String', 'MODEL_PROFILE', '"FX_991_CN_CW"'
            buildConfigField 'String', 'MODEL_LABEL', '"CN Scientific 991"'
            buildConfigField 'boolean', 'MODEL_EXTENDED', 'false'
            buildConfigField 'boolean', 'HAS_DISTRIBUTION', 'false'
            buildConfigField 'boolean', 'HAS_SPREADSHEET', 'false'
            buildConfigField 'int', 'APPLICATION_COUNT', '10'
            resValue 'string', 'app_name', 'CN Scientific 991'
            resValue 'string', 'app_model_name', 'CN Scientific 991'
        }
    }

    // CI restores this exact file before building.  Override only the debug
    // keystore path; Android's normal debug alias/password settings remain in use.
    signingConfigs {
        debug {
            storeFile file("${System.getProperty('user.home')}/.android/debug.keystore")
        }
    }

    // AGP 8 can disable BuildConfig generation for new projects.  The
    // generated model constants above are part of the small UI/configuration
    // contract, so keep it explicit instead of relying on a plugin default.
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation project(':core')
}
