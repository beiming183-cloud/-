name: 临时 Stage6 最终构建签名门禁

on:
  push:
    branches: [ stage6/integration ]
    paths:
      - '.github/workflows/temp-stage6-final-gate.yml'

permissions:
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: DA6901B21ED9CCD8E33F4BFA6D2726183913F4E6C13910705E210184A17A5D33
      EXPECTED_APPLICATION_ID: com.beibei.calculator

    steps:
      - name: 检出集成分支
        uses: actions/checkout@v4
        with:
          ref: stage6/integration
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 恢复长期 release 签名
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.BEIBEI_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE" || { echo '缺少 BEIBEI_SIGNING_BUNDLE_B64'; exit 1; }
          SIGNING_DIR="$RUNNER_TEMP/beibei-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/beibei-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/beibei-signing.tar.gz" -C "$SIGNING_DIR"
          source "$SIGNING_DIR/signing.env"
          echo "::add-mask::$BEIBEI_STORE_PASSWORD"
          echo "::add-mask::$BEIBEI_KEY_PASSWORD"
          echo "BEIBEI_KEYSTORE_PATH=$SIGNING_DIR/beibei-release.jks" >> "$GITHUB_ENV"
          echo "BEIBEI_STORE_PASSWORD=$BEIBEI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_PASSWORD=$BEIBEI_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_ALIAS=$BEIBEI_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归
        run: ./gradlew :core:check

      - name: 构建 Debug APK
        run: ./gradlew :app:assembleCn991Debug

      - name: 构建 Release APK 并校验 R8
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleCn991Release 2>&1 | tee release-build.log
          if grep -Fq 'Invalid stack map table' release-build.log; then
            echo '检测到 R8 Invalid stack map table'
            exit 1
          fi

      - name: 校验长期签名与包名
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/cn991/release -name '*.apk' | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          ACTUAL_FP=$(printf '%s\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest' | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL_FP" = "$EXPECTED_CERT_SHA256" || { echo "签名指纹不匹配: $ACTUAL_FP"; exit 1; }
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          ACTUAL_APP_ID=$("$APKANALYZER" manifest application-id "$APK")
          test "$ACTUAL_APP_ID" = "$EXPECTED_APPLICATION_ID" || { echo "包名不匹配: $ACTUAL_APP_ID"; exit 1; }
          ACTUAL_VERSION_NAME=$("$APKANALYZER" manifest version-name "$APK")
          ACTUAL_VERSION_CODE=$("$APKANALYZER" manifest version-code "$APK")
          echo "Application ID: $ACTUAL_APP_ID"
          echo "Version name: $ACTUAL_VERSION_NAME"
          echo "Version code: $ACTUAL_VERSION_CODE"
          echo "Certificate SHA-256: $ACTUAL_FP"
          echo "SIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: 保存长期签名测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: stage6-stable-signed-apk
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
