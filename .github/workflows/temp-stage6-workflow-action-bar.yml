name: 临时 Stage6 WorkflowAction 操作条验证

on:
  push:
    branches: [ stage6/integration ]
    paths:
      - '.github/workflows/temp-stage6-workflow-action-bar.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出集成分支
        uses: actions/checkout@v4
        with:
          ref: stage6/integration
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 应用 WorkflowAction 操作条补丁
        run: python scripts/temp_stage6_workflow_action_bar.py

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归测试
        run: ./gradlew :core:check

      - name: 构建 Android Debug APK
        run: ./gradlew :app:assembleCn991Debug

      - name: 提交正式产品改动
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/src/main/java/com/codex/fx991/core/cw/CnCwMachine.java \
                  core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java \
                  app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          git commit -m "feat(stage6): add workflow action touch bar"
          git push origin HEAD:stage6/integration
