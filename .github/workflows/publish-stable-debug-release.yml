name: Publish stable-signing test APK

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download exact verified APK artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: beiming183-cloud/-
        shell: bash
        run: |
          gh api repos/beiming183-cloud/-/actions/artifacts/10442113179/zip > artifact.zip
          unzip -q artifact.zip -d artifact
          APK=$(find artifact -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" CN991-stable-update-0.3.9-debug.apk

      - name: Publish normal GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: beiming183-cloud/-
        shell: bash
        run: |
          TAG="chat-20260916-stable-signing"
          gh release create "$TAG" CN991-stable-update-0.3.9-debug.apk \
            --target 3e52448fe7f30e8075d2c92bde58e437aa4a47b4 \
            --title "CN991 0.3.9 - Stable Update Signing" \
            --notes "测试更新基线版。已将 debug APK 固定绑定到同一测试签名，并在不同 GitHub Runner 上连续构建验证证书 SHA-256 一致：8427d60083951dc5bceab9663c851070145182c66c11a467b1d72a734434c688。首次从旧签名版本迁移仍需卸载一次；安装本版后，同一测试签名链的后续版本可直接覆盖更新。包含此前选区热区、空白长按粘贴和复制粘贴语义链修复。"
