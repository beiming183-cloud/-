name: Fix real result and Ans paths

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/continue-20260916
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply product patch
        run: python3 tools/chat_fix_result_ans_reachability.py
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Verify patched source paths
        shell: bash
        run: |
          grep -F 'drawNaturalScientificResult(canvas, scientific, lcd, contentTop,' app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          grep -F 'scientific.replace("E", "×10^").replace("e", "×10^")' app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          grep -F 'state.resultShown() && state.hasAns()' app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          grep -F '&& isResultBand(displayDownY))' app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          grep -F 'return currentResult;' app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          grep -F 'versionCode 325' app/build.gradle
          grep -F "versionName '0.3.11'" app/build.gradle
      - name: Run full core regression
        run: ./gradlew :core:check
      - name: Compile Android Java
        run: ./gradlew :app:compileCn991DebugJavaWithJavac
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/fx991smooth/CalculatorView.java app/build.gradle
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m "fix: route long results to natural SCI and expose Ans copy"
          git push origin HEAD:chat/continue-20260916
