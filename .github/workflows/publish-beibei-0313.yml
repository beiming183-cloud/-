name: Publish verified Beibei Calculator 0.3.13 APK

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: "github.event.head_commit.message == 'ci: publish 北北计算器 0.3.13 APK'"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact verified APK artifact
        shell: bash
        run: |
          mkdir -p release-apk
          gh run download 35091421631 --repo beiming183-cloud/beibei-calculator --name cn991-debug-apk --dir release-apk
          find release-apk -type f -name '*.apk' -print
      - name: Publish normal GitHub Release
        shell: bash
        run: |
          APK=$(find release-apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" beibei-calculator-0.3.13-debug.apk
          gh release create beibei-0.3.13 beibei-calculator-0.3.13-debug.apk \
            --repo beiming183-cloud/beibei-calculator \
            --target 3dfa48b127f81b6a23f30b4512ff5d56345da078 \
            --title '北北计算器 0.3.13' \
            --notes '品牌收口版。Android 桌面名称、应用内产品名称与模型标签统一为“北北计算器”；仓库品牌统一为 beibei-calculator。内部兼容 flavor、包名和固定测试签名保持不变，因此可直接覆盖此前固定签名版本。Stage 2 真机差分验收已标记通过。正式 CI run 35091421631 已通过完整核心回归、Android Debug APK 构建、固定签名恢复和 artifact 上传。versionCode 327。'
