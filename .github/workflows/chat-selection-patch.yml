name: Chat mobile selection patch

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  patch-selection:
    if: ${{ !contains(github.event.head_commit.message, '[chat-selection-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出续开发分支
        uses: actions/checkout@v4
        with:
          ref: chat/continue-20260916
          fetch-depth: 0

      - name: 应用手机式双边界选区补丁
        run: |
          python tools/chat_patch_selection_handles.py
          python tools/chat_patch_selection_hitbox.py

      - name: 提交补丁
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "chat-continuation"
          git config user.email "actions@users.noreply.github.com"
          git add core/src/main/java/com/codex/fx991/core/cw/CnCwMachine.java
          git add core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java
          git add app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          git commit -m "feat: add independent phone-style selection handles [chat-selection-patch]"
          git push origin HEAD:chat/continue-20260916
