name: One-shot SCI marker length fix

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'chore: start SCI marker-length fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/continue-20260916
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fix ×10^ marker length
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/codex/fx991smooth/CalculatorView.java')
          text = path.read_text(encoding='utf-8')
          start = text.index('    /** Draws SCI/ENG output as a handheld-style mantissa × 10 with a raised exponent. */')
          end = text.index('    /** Draws handheld-style stacked fractions for exact scalar results. */', start)
          block = text[start:end]
          old = 'int markerLength = 3;'
          if old not in block:
              raise SystemExit('expected markerLength=3 not found in SCI renderer')
          block = block.replace(old, 'int markerLength = 4;', 1)
          path.write_text(text[:start] + block + text[end:], encoding='utf-8')
          PY
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Run full core regression
        run: ./gradlew :core:check
      - name: Compile Android Java
        run: ./gradlew :app:compileCn991DebugJavaWithJavac
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          git commit -m "fix: parse natural scientific exponent boundary"
          git push origin HEAD:chat/continue-20260916
