name: 北北计算器长期签名发布

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag，例如 beibei-0.3.16'
        required: true
      title:
        description: 'Release 标题，例如 北北计算器 0.3.16'
        required: true

permissions:
  contents: write

jobs:
  stable-release:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: DA6901B21ED9CCD8E33F4BFA6D2726183913F4E6C13910705E210184A17A5D33
      EXPECTED_APPLICATION_ID: com.beibei.calculator

    steps:
      - name: 检出源代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 校验 Release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            beibei-[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo 'tag 必须使用 beibei-X.Y.Z 格式'; exit 1 ;;
          esac
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '该 Release tag 已存在，拒绝覆盖发布'
            exit 1
          fi

      - name: 恢复长期 release 签名
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.BEIBEI_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE" || { echo '缺少 BEIBEI_SIGNING_BUNDLE_B64，拒绝生成可发布 APK'; exit 1; }
          SIGNING_DIR="$RUNNER_TEMP/beibei-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/beibei-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/beibei-signing.tar.gz" -C "$SIGNING_DIR"
          source "$SIGNING_DIR/signing.env"
          echo "::add-mask::$BEIBEI_STORE_PASSWORD"
          echo "::add-mask::$BEIBEI_KEY_PASSWORD"
          echo "BEIBEI_KEYSTORE_PATH=$SIGNING_DIR/beibei-release.jks" >> "$GITHUB_ENV"
          echo "BEIBEI_STORE_PASSWORD=$BEIBEI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_PASSWORD=$BEIBEI_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_ALIAS=$BEIBEI_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归
        run: ./gradlew :core:check

      - name: 构建正式 Release APK并校验R8
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleCn991Release 2>&1 | tee release-build.log
          if grep -Fq 'Invalid stack map table' release-build.log; then
            echo '检测到 R8 Invalid stack map table，禁止发布'
            exit 1
          fi

      - name: 硬校验包名、版本与签名
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/cn991/release -name '*.apk' | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          ACTUAL_FP=$(printf '%s\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest' | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_FP" || { echo '无法解析签名指纹，禁止发布'; exit 1; }
          echo "Release certificate SHA-256: $ACTUAL_FP"
          test "$ACTUAL_FP" = "$EXPECTED_CERT_SHA256" || { echo '签名指纹不匹配，禁止发布'; exit 1; }

          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          ACTUAL_APP_ID=$("$APKANALYZER" manifest application-id "$APK")
          ACTUAL_VERSION_NAME=$("$APKANALYZER" manifest version-name "$APK")
          ACTUAL_VERSION_CODE=$("$APKANALYZER" manifest version-code "$APK")
          EXPECTED_VERSION_NAME="${RELEASE_TAG#beibei-}"

          echo "Application ID: $ACTUAL_APP_ID"
          echo "Version name: $ACTUAL_VERSION_NAME"
          echo "Version code: $ACTUAL_VERSION_CODE"
          test "$ACTUAL_APP_ID" = "$EXPECTED_APPLICATION_ID" || { echo '包名不匹配，禁止发布'; exit 1; }
          test "$ACTUAL_VERSION_NAME" = "$EXPECTED_VERSION_NAME" || { echo 'tag 与 APK versionName 不一致，禁止发布'; exit 1; }
          test -n "$ACTUAL_VERSION_CODE" || { echo '无法读取 versionCode，禁止发布'; exit 1; }

          OUT="$RUNNER_TEMP/beibei-calculator-$EXPECTED_VERSION_NAME-release.apk"
          cp "$APK" "$OUT"
          echo "RELEASE_APK=$OUT" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION=$EXPECTED_VERSION_NAME" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_CODE=$ACTUAL_VERSION_CODE" >> "$GITHUB_ENV"

      - name: 保存长期签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: beibei-stable-release-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "${{ inputs.tag }}" "$RELEASE_APK" \
            --target "$GITHUB_SHA" \
            --title "${{ inputs.title }}" \
            --notes "北北计算器长期签名正式安装版。Application ID: $EXPECTED_APPLICATION_ID；versionName: $RELEASE_VERSION；versionCode: $RELEASE_VERSION_CODE；证书 SHA-256: $EXPECTED_CERT_SHA256。后续正式版本必须保持同一包名与同一签名。"
