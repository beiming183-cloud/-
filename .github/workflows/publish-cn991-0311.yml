name: Publish verified CN991 0.3.11 APK

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    if: "github.event.head_commit.message == 'ci: publish verified CN991 0.3.11 APK'"
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact verified APK artifact
        shell: bash
        run: |
          mkdir -p release-apk
          gh run download 35088941116 --repo beiming183-cloud/- --name cn991-debug-apk --dir release-apk
          find release-apk -type f -name '*.apk' -print
      - name: Publish normal GitHub Release
        shell: bash
        run: |
          APK=$(find release-apk -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" CN991-0.3.11-debug.apk
          gh release create chat-20260916-real-sci-ans-0311 CN991-0.3.11-debug.apk \
            --repo beiming183-cloud/- \
            --target e40191800fdb70563dcc2f158ca82475935ff4e7 \
            --title 'CN991 0.3.11 - Real SCI/Ans Path Fix' \
            --notes '真机反馈修复版。修复超长普通整数在兜底路径仍显示 E 记法的问题：超长数字转科学计数后会重新进入尾数 × 10 + 上标指数绘制器，禁止直接显示 E。结果显示状态下长按屏幕下半部结果数字，直接打开复制菜单，可复制 Ans；刚计算出的 Ans 复制直接保留当前结果字符串，避免大整数经 double 转换丢位。versionCode 325。正式 PR CI run 35088941116 已通过完整核心回归和 CN991 Debug APK 构建；固定签名 SHA-256 仍为 8427d60083951dc5bceab9663c851070145182c66c11a467b1d72a734434c688，可从 0.3.10 直接覆盖安装。'
