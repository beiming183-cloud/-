name: 临时 Stage5 0.3.18 长期签名测试发布

on:
  push:
    branches: [ stage5/application-workflows ]
    paths:
      - '.github/workflows/temp-stage5-0318-release.yml'

permissions:
  contents: write

jobs:
  release-test:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: DA6901B21ED9CCD8E33F4BFA6D2726183913F4E6C13910705E210184A17A5D33
      EXPECTED_APPLICATION_ID: com.beibei.calculator
      RELEASE_TAG: beibei-0.3.18
      RELEASE_TITLE: 北北计算器 0.3.18 · Stage 5 真机测试版

    steps:
      - name: 检出源代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确认 tag 未占用
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '0.3.18 Release 已存在，拒绝覆盖'
            exit 1
          fi

      - name: 恢复长期 release 签名
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.BEIBEI_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE" || { echo '缺少 BEIBEI_SIGNING_BUNDLE_B64，拒绝生成 APK'; exit 1; }
          SIGNING_DIR="$RUNNER_TEMP/beibei-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/beibei-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/beibei-signing.tar.gz" -C "$SIGNING_DIR"
          source "$SIGNING_DIR/signing.env"
          echo "::add-mask::$BEIBEI_STORE_PASSWORD"
          echo "::add-mask::$BEIBEI_KEY_PASSWORD"
          echo "BEIBEI_KEYSTORE_PATH=$SIGNING_DIR/beibei-release.jks" >> "$GITHUB_ENV"
          echo "BEIBEI_STORE_PASSWORD=$BEIBEI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_PASSWORD=$BEIBEI_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_ALIAS=$BEIBEI_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归
        run: ./gradlew :core:check

      - name: 构建 Release APK并校验R8
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleCn991Release 2>&1 | tee release-build.log
          if grep -Fq 'Invalid stack map table' release-build.log; then
            echo '检测到 R8 Invalid stack map table，禁止发布'
            exit 1
          fi

      - name: 硬校验包名版本签名
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/cn991/release -name '*.apk' | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          ACTUAL_FP=$(printf '%s\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest' | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL_FP" = "$EXPECTED_CERT_SHA256" || { echo "签名错误: $ACTUAL_FP"; exit 1; }

          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          ACTUAL_APP_ID=$("$APKANALYZER" manifest application-id "$APK")
          ACTUAL_VERSION_NAME=$("$APKANALYZER" manifest version-name "$APK")
          ACTUAL_VERSION_CODE=$("$APKANALYZER" manifest version-code "$APK")
          test "$ACTUAL_APP_ID" = "$EXPECTED_APPLICATION_ID" || { echo '包名错误'; exit 1; }
          test "$ACTUAL_VERSION_NAME" = '0.3.18' || { echo "versionName 错误: $ACTUAL_VERSION_NAME"; exit 1; }
          test "$ACTUAL_VERSION_CODE" = '332' || { echo "versionCode 错误: $ACTUAL_VERSION_CODE"; exit 1; }

          OUT="$RUNNER_TEMP/beibei-calculator-0.3.18-release.apk"
          cp "$APK" "$OUT"
          echo "RELEASE_APK=$OUT" >> "$GITHUB_ENV"
          echo "证书 SHA-256: $ACTUAL_FP"
          echo "Application ID: $ACTUAL_APP_ID"
          echo "Version: $ACTUAL_VERSION_NAME ($ACTUAL_VERSION_CODE)"

      - name: 保存长期签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: beibei-0.3.18-stable-test-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error

      - name: 发布 prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --prerelease \
            --notes "Stage 5 真机验收包。新增统计、方程、矩阵、向量的 core-owned 输入规格、统一 workflow session 与 Android 专用输入页；旧逗号输入继续兼容。Application ID 保持 com.beibei.calculator；versionName 0.3.18；versionCode 332；继续使用北北计算器长期 Release 签名。PR #5 仍为 Draft，后续集中真机验收。"
