name: Android 云端构建

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行核心回归测试
        run: ./gradlew :core:regressionTest

      - name: 构建 CN991 调试 APK
        run: ./gradlew :app:assembleCn991Debug

      - name: 保存 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cn991-debug-apk
          path: app/build/outputs/apk/cn991/**/*.apk
          if-no-files-found: error
