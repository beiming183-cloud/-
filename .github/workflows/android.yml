name: Android 云端构建

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 应用旧版 991 功能补丁
        shell: bash
        run: |
          git fetch origin stage6/integration
          git checkout -B stage6/integration origin/stage6/integration
          python scripts/stage6_manual_gap_patch.py
          rm scripts/stage6_manual_gap_patch.py
          git checkout HEAD^ -- .github/workflows/android.yml
          git config user.name "beibei-stage6-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: close remaining 991 manual feature gaps"
          git push origin HEAD:stage6/integration

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归测试
        run: ./gradlew :core:check

      - name: 构建开发调试 APK
        run: ./gradlew :app:assembleCn991Debug

      - name: 保存开发调试 APK
        uses: actions/upload-artifact@v4
        with:
          name: beibei-debug-apk
          path: app/build/outputs/apk/cn991/debug/*.apk
          if-no-files-found: error
