name: Android 云端构建

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出源代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      # GitHub Runner 每次都是新机器。若每次都临时生成 debug 证书，
      # Android 会把下一版视为不同开发者签名，无法直接覆盖安装。
      - name: 恢复固定测试签名
        id: debug-signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: cn991-debug-signing-v1

      # 第一次没有缓存时主动生成一次；随后 actions/cache 会在任务结束时
      # 保存这把测试签名。后续构建恢复同一个文件，因此签名保持一致。
      - name: 首次初始化测试签名
        if: steps.debug-signing-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -noprompt \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归测试
        run: ./gradlew :core:check

      - name: 构建 CN991 调试 APK
        run: ./gradlew :app:assembleCn991Debug

      - name: 记录 APK 签名指纹
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/cn991 -name '*.apk' | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: 保存 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cn991-debug-apk
          path: app/build/outputs/apk/cn991/**/*.apk
          if-no-files-found: error
