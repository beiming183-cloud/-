name: Publish chat APK release

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish-chat-apk]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested product commit
        uses: actions/checkout@v4
        with:
          ref: 58c676fb5adb49d05c30cf4c5f08f25fe05a5bbf

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build verified APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :core:check
          ./gradlew :app:assembleCn991Debug
          APK=$(find app/build/outputs/apk/cn991 -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" CN991-chat-clipboard-fix.apk

      - name: Create GitHub prerelease and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="chat-20260916-clipboard-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CN991-chat-clipboard-fix.apk --clobber
          else
            gh release create "$TAG" CN991-chat-clipboard-fix.apk \
              --target 58c676fb5adb49d05c30cf4c5f08f25fe05a5bbf \
              --title "CN991 Chat Test - Clipboard Fix" \
              --notes "聊天模式测试版。修复复制粘贴语义链、56² 粘贴、√/π/i/Ans/科学计数法粘贴，并补齐复制粘贴触感反馈。对应已通过完整核心回归和 APK 构建的提交 58c676f。" \
              --prerelease
          fi
