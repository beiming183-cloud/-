name: Stage 3 Android Step 7 verification

on:
  push:
    branches: [ stage3/semantic-editor ]
    paths:
      - tools/stage3_android_step7_patch.py
      - .github/workflows/stage3-android-step7.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 Stage 3 分支
        uses: actions/checkout@v4
        with:
          ref: stage3/semantic-editor
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 应用 Step 7 Android 语义迁移补丁
        run: python tools/stage3_android_step7_patch.py

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归
        run: ./gradlew :core:check

      - name: 构建 Android APK
        run: ./gradlew :app:assembleCn991Debug

      - name: 提交正式产品改动
        shell: bash
        run: |
          git config user.name "beibei"
          git config user.email "beiming183@gmail.com"
          git add core app
          if git diff --cached --quiet; then
            echo "No product changes to commit"
            exit 0
          fi
          git commit -m "feat(stage3): migrate Android touch routing to semantic paths"
          git push origin HEAD:stage3/semantic-editor
