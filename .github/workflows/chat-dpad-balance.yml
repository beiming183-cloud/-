name: Chat dpad balance patch

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  patch-dpad:
    if: ${{ !contains(github.event.head_commit.message, '[chat-dpad-balance]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout continuation branch
        uses: actions/checkout@v4
        with:
          ref: chat/continue-20260916
          fetch-depth: 0

      - name: Apply balanced dpad spacing
        run: python tools/chat_patch_dpad_balance.py

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "chat-continuation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/codex/fx991smooth/PhysicalKeyLayout.java
          git commit -m "fix: balance dpad spacing between side controls [chat-dpad-balance]"
          git push origin HEAD:chat/continue-20260916
