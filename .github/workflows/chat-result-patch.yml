name: Chat result display patch

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  patch-result-display:
    if: ${{ !contains(github.event.head_commit.message, '[chat-result-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - name: 检出续开发分支
        uses: actions/checkout@v4
        with:
          ref: chat/continue-20260916
          fetch-depth: 0

      - name: 应用结果显示补丁
        run: python tools/chat_patch_result_display.py

      - name: 提交补丁
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "chat-continuation"
          git config user.email "actions@users.noreply.github.com"
          git add app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          git commit -m "fix: fit long calculator results without ellipsis [chat-result-patch]"
          git push origin HEAD:chat/continue-20260916
