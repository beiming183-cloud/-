name: Chat natural scientific display and Ans copy fix

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/continue-20260916
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply one-shot product patch
        run: python3 tools/chat_patch_natural_sci_ans.py
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Run full core regression
        run: ./gradlew :core:check
      - name: Compile CN991 debug APK
        run: ./gradlew :app:assembleCn991Debug
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/codex/fx991smooth/CalculatorView.java core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java app/build.gradle
          git commit -m "fix: natural scientific display and copyable Ans"
          git push origin HEAD:chat/continue-20260916
