name: Publish 北北计算器 0.3.15 stable

on:
  push:
    branches: [ stage3/semantic-editor ]
    paths:
      - .github/workflows/publish-stable-0315.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: DA6901B21ED9CCD8E33F4BFA6D2726183913F4E6C13910705E210184A17A5D33
      EXPECTED_APPLICATION_ID: com.beibei.calculator
    steps:
      - name: 检出源代码
        uses: actions/checkout@v4

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 恢复长期 release 签名
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.BEIBEI_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE" || { echo '缺少 BEIBEI_SIGNING_BUNDLE_B64，拒绝发布'; exit 1; }
          SIGNING_DIR="$RUNNER_TEMP/beibei-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/beibei-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/beibei-signing.tar.gz" -C "$SIGNING_DIR"
          source "$SIGNING_DIR/signing.env"
          echo "::add-mask::$BEIBEI_STORE_PASSWORD"
          echo "::add-mask::$BEIBEI_KEY_PASSWORD"
          echo "BEIBEI_KEYSTORE_PATH=$SIGNING_DIR/beibei-release.jks" >> "$GITHUB_ENV"
          echo "BEIBEI_STORE_PASSWORD=$BEIBEI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_PASSWORD=$BEIBEI_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_ALIAS=$BEIBEI_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归
        run: ./gradlew :core:check

      - name: 构建正式 Release APK
        run: ./gradlew :app:assembleCn991Release

      - name: 硬校验包名与签名指纹
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/cn991/release -name '*.apk' | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          ACTUAL_FP=$(printf '%s\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest' | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_FP" || { echo '无法解析签名指纹，禁止发布'; exit 1; }
          echo "Release certificate SHA-256: $ACTUAL_FP"
          test "$ACTUAL_FP" = "$EXPECTED_CERT_SHA256" || { echo '签名指纹不匹配，禁止发布'; exit 1; }
          ACTUAL_APP_ID=$("$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest application-id "$APK")
          echo "Application ID: $ACTUAL_APP_ID"
          test "$ACTUAL_APP_ID" = "$EXPECTED_APPLICATION_ID" || { echo '包名不匹配，禁止发布'; exit 1; }
          OUT="$RUNNER_TEMP/beibei-calculator-0.3.15-release.apk"
          cp "$APK" "$OUT"
          echo "RELEASE_APK=$OUT" >> "$GITHUB_ENV"

      - name: 保存长期签名 APK
        uses: actions/upload-artifact@v4
        with:
          name: beibei-stable-release-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "beibei-0.3.15" "$RELEASE_APK" \
            --target "$GITHUB_SHA" \
            --title "北北计算器 0.3.15" \
            --notes "北北计算器长期签名正式安装版。Application ID: $EXPECTED_APPLICATION_ID。证书 SHA-256: $EXPECTED_CERT_SHA256。后续正式版本必须保持同一包名与同一签名；CI 指纹不一致会直接失败，禁止发布。"
