name: Publish selection paste test APK

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[publish-selection-paste]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact tested commit
        uses: actions/checkout@v4
        with:
          ref: edac335fdeac155e7c5417bed007ea46d1219422

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build verified APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :core:check
          ./gradlew :app:assembleCn991Debug
          APK=$(find app/build/outputs/apk/cn991 -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" CN991-selection-paste-fix.apk

      - name: Create normal GitHub Release and attach APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="chat-20260916-selection-paste-fix"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" CN991-selection-paste-fix.apk --clobber
          else
            gh release create "$TAG" CN991-selection-paste-fix.apk \
              --target edac335fdeac155e7c5417bed007ea46d1219422 \
              --title "CN991 Selection & Paste Fix" \
              --notes "测试版：扩大选区左右抓手的实际触摸热区；空表达式长按可直接打开粘贴菜单；保留此前复制粘贴语义链修复。对应已通过完整核心回归和 APK 构建的提交 edac335。"
          fi
