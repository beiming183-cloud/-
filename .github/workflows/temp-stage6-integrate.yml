name: 临时 Stage6 三分支集成验证

on:
  push:
    branches: [ stage6/integration ]
    paths:
      - '.github/workflows/temp-stage6-integrate.yml'

permissions:
  contents: write

jobs:
  integrate-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出集成分支
        uses: actions/checkout@v4
        with:
          ref: stage6/integration
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin stage6/workflow-experience stage6/remaining-workflows

      - name: 合入工作流体验分支并解决已知非代码冲突
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-ff --no-commit origin/stage6/workflow-experience
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U | sort)
            printf '冲突文件:\n%s\n' "$conflicts"
            expected=$(printf '%s\n' 'core/build.gradle' 'docs/hand-offs/STAGE6_RELAY.md' | sort)
            test "$conflicts" = "$expected" || { echo '出现未预期代码冲突，停止自动集成'; exit 1; }
            git checkout --ours core/build.gradle
            python - <<'PY'
          from pathlib import Path
          p = Path('core/build.gradle')
          s = p.read_text(encoding='utf-8')
          if "cwWorkflowValidationTest" not in s:
              marker = "tasks.register('manualFunctionsTest', JavaExec) {"
              block = """tasks.register('cwWorkflowValidationTest', JavaExec) {
              group = 'verification'
              description = 'Runs Stage 6 workflow cell validation and error-location checks.'
              classpath = sourceSets.regression.runtimeClasspath
              mainClass = 'com.codex.fx991.core.CnCwWorkflowValidationSuite'
              dependsOn tasks.named('regressionClasses')
          }

          """
              if marker not in s:
                  raise SystemExit('manualFunctionsTest marker missing')
              s = s.replace(marker, block + marker, 1)
              dep_marker = "    dependsOn tasks.named('cwCalculationStateTest')\n"
              if dep_marker not in s:
                  raise SystemExit('calculation-state dependency marker missing')
              s = s.replace(dep_marker, dep_marker + "    dependsOn tasks.named('cwWorkflowValidationTest')\n", 1)
              p.write_text(s, encoding='utf-8')
          PY
            git checkout --ours docs/hand-offs/STAGE6_RELAY.md
            git add core/build.gradle docs/hand-offs/STAGE6_RELAY.md
          fi
          git commit -m 'merge(stage6): integrate workflow experience work'

      - name: 合入剩余结构化工作流分支并解决接力文档冲突
        shell: bash
        run: |
          set -euo pipefail
          set +e
          git merge --no-ff --no-commit origin/stage6/remaining-workflows
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            conflicts=$(git diff --name-only --diff-filter=U | sort)
            printf '冲突文件:\n%s\n' "$conflicts"
            test "$conflicts" = 'docs/hand-offs/STAGE6_RELAY.md' || { echo '出现未预期代码冲突，停止自动集成'; exit 1; }
            git checkout --ours docs/hand-offs/STAGE6_RELAY.md
            git add docs/hand-offs/STAGE6_RELAY.md
          fi
          git commit -m 'merge(stage6): integrate remaining structured workflows'

      - name: 清理一次性验证文件
        run: |
          rm -f scripts/temp_stage6_shape_actions.py
          rm -f scripts/temp_stage6_shape_actions_fix.py
          rm -f scripts/temp_stage6_inequality_choice.py
          rm -f .github/workflows/temp-stage6-inequality-choice.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(stage6): remove temporary parallel validation files'
          fi

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 完整核心回归
        run: ./gradlew :core:check

      - name: Android Debug 构建
        run: ./gradlew :app:assembleCn991Debug

      - name: 推送已验证集成结果
        run: git push origin HEAD:stage6/integration
