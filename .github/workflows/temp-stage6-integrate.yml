name: 临时 Stage6 三分支集成验证

on:
  push:
    branches: [ stage6/integration ]
    paths:
      - '.github/workflows/temp-stage6-integrate.yml'

permissions:
  contents: write

jobs:
  integrate-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出集成分支
        uses: actions/checkout@v4
        with:
          ref: stage6/integration
          fetch-depth: 0

      - name: 配置 Git
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin stage6/workflow-experience stage6/remaining-workflows

      - name: 合入工作流体验分支
        run: git merge --no-ff --no-edit origin/stage6/workflow-experience

      - name: 合入剩余结构化工作流分支
        run: git merge --no-ff --no-edit origin/stage6/remaining-workflows

      - name: 清理一次性验证文件
        run: |
          rm -f scripts/temp_stage6_shape_actions.py
          rm -f scripts/temp_stage6_shape_actions_fix.py
          rm -f scripts/temp_stage6_inequality_choice.py
          rm -f .github/workflows/temp-stage6-inequality-choice.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(stage6): remove temporary parallel validation files'
          fi

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 完整核心回归
        run: ./gradlew :core:check

      - name: Android Debug 构建
        run: ./gradlew :app:assembleCn991Debug

      - name: 推送已验证集成结果
        run: git push origin HEAD:stage6/integration
