name: 临时 Stage6 尺寸动作接入

on:
  push:
    branches: [ stage6/workflow-experience ]
    paths:
      - '.github/workflows/temp-stage6-shape-actions.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@v4
        with:
          ref: stage6/workflow-experience
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 应用 Stage 6 尺寸动作补丁
        shell: bash
        run: |
          python scripts/temp_stage6_shape_actions.py
          python - <<'PY'
          from pathlib import Path
          p = Path('core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java')
          text = p.read_text(encoding='utf-8')
          old = '''        CnCwMachine matrix = homeApplication(CnCwModel.FX_991_CN_CW, 6);\n        matrix.dispatch(CnCwKey.OK);\n'''
          new = '''        CnCwMachine matrix = new CnCwMachine(CnCwModel.FX_991_CN_CW);\n        while (!"MATRIX".equals(matrix.state().homeItems()\n                .get(matrix.state().selectedIndex()).id())) {\n            matrix.dispatch(CnCwKey.RIGHT);\n        }\n        matrix.dispatch(CnCwKey.OK);\n        matrix.dispatch(CnCwKey.OK);\n'''
          if old not in text:
              raise SystemExit('matrix regression target not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 完整核心回归
        run: ./gradlew :core:check

      - name: Android Debug 构建
        run: ./gradlew :app:assembleCn991Debug

      - name: 提交正式产品改动
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/src/main/java/com/codex/fx991/core/cw/CnCwWorkflowSession.java \
                  core/src/main/java/com/codex/fx991/core/cw/CnCwMachine.java \
                  core/src/regression/java/com/codex/fx991/core/CnCwWorkflowSpecSuite.java \
                  core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java
          git commit -m "feat(stage6): expose workflow shapes and mutation actions"
          git push origin HEAD:stage6/workflow-experience
