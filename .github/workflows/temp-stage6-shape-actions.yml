name: 临时 Stage6 尺寸动作接入

on:
  push:
    branches: [ stage6/workflow-experience ]
    paths:
      - '.github/workflows/temp-stage6-shape-actions.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 检出分支
        uses: actions/checkout@v4
        with:
          ref: stage6/workflow-experience
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 应用 Stage 6 尺寸动作补丁
        shell: bash
        run: |
          python scripts/temp_stage6_shape_actions.py
          python - <<'PY'
          from pathlib import Path
          p = Path('core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java')
          text = p.read_text(encoding='utf-8')
          start = text.index('    private void workflowMutationActionsStayCoreOwned() {')
          end = text.index('    private void spreadsheetCompactWorkflowPersistsCells() {', start)
          method = '''    private void workflowMutationActionsStayCoreOwned() {
              CnCwMachine statistics = homeApplication(CnCwModel.FX_991_CN_CW, 1);
              statistics.dispatch(CnCwKey.OK);
              check(statistics.state().hasWorkflowInput(),
                      "statistics command opens structured workflow");
              equal("1 条", statistics.state().workflowInput().shapeLabel(),
                      "statistics UI snapshot starts with core-owned shape label");
              press(statistics, CnCwKey.DIGIT_7);
              statistics.applyWorkflowMutation(CnCwWorkflowAction.Type.ADD_ROW);
              check(statistics.state().hasWorkflowInput(),
                      "statistics remains in workflow after mutation");
              equal("2 条", statistics.state().workflowInput().shapeLabel(),
                      "machine mutation updates core-owned shape");
              equal("7", statistics.state().workflowInput().cell(0, 0),
                      "machine mutation commits active cell before adding row");
              check(statistics.state().status().contains("2 条"),
                      "workflow status exposes human-readable shape");
          }

'''
          p.write_text(text[:start] + method + text[end:], encoding='utf-8')
          PY

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 完整核心回归
        run: ./gradlew :core:check

      - name: Android Debug 构建
        run: ./gradlew :app:assembleCn991Debug

      - name: 提交正式产品改动
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add core/src/main/java/com/codex/fx991/core/cw/CnCwWorkflowSession.java \
                  core/src/main/java/com/codex/fx991/core/cw/CnCwMachine.java \
                  core/src/regression/java/com/codex/fx991/core/CnCwWorkflowSpecSuite.java \
                  core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java
          git commit -m "feat(stage6): expose workflow shapes and mutation actions"
          git push origin HEAD:stage6/workflow-experience
