name: 临时 Stage6 函数表结果页修复验证

on:
  push:
    branches: [ stage6/integration ]
    paths:
      - '.github/workflows/temp-stage6-table-result-fix.yml'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: DA6901B21ED9CCD8E33F4BFA6D2726183913F4E6C13910705E210184A17A5D33
      EXPECTED_APPLICATION_ID: com.beibei.calculator
    steps:
      - name: 检出集成分支
        uses: actions/checkout@v4
        with:
          ref: stage6/integration
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 修复 TABLE 结果页编辑态泄露
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/codex/fx991smooth/CalculatorView.java')
          text = path.read_text(encoding='utf-8')
          start_marker = '        boolean showExpandedAnsProcess = state.resultShown()\n'
          end_marker = '        } else if (state.resultShown() && !state.result().isEmpty()) {\n'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('未找到预期 drawApplicationScreen 结果绘制边界，停止静默改动')
          end += len(end_marker)
          old = text[start:end]
          required_old = [
              'drawNaturalExpression(canvas, state.naturalExpression()',
              'if (state.hasSelection()) {',
              'if (state.resultShown() && state.hasStructuredApplicationResult()) {',
              'drawStructuredApplicationResult(canvas, state.applicationResult(), lcd,'
          ]
          missing = [item for item in required_old if item not in old]
          if missing:
              raise SystemExit('目标绘制分支结构与预期不一致: ' + repr(missing))
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('结果绘制边界不唯一，停止静默改动')
          new_lines = [
              '        CnCwModeEngine.ModeResult structuredResult = state.resultShown()',
              '                && state.hasStructuredApplicationResult() ? state.applicationResult() : null;',
              '        boolean tableResultShown = structuredResult != null',
              '                && structuredResult.layout() == CnCwModeEngine.ResultLayout.TABLE;',
              '        boolean showExpandedAnsProcess = !tableResultShown',
              '                && state.resultShown()',
              '                && state.expression().contains("Ans")',
              '                && !machine.calculationProcessDisplay().isBlank();',
              '        if (!tableResultShown) {',
              '            if (showExpandedAnsProcess) {',
              '                drawInspectionProcess(canvas, machine.calculationProcessDisplay(), lcd,',
              '                        contentTop, contentBottom, available);',
              '            } else {',
              '                drawNaturalExpression(canvas, state.naturalExpression(), lcd, contentTop,',
              '                        contentBottom, available);',
              '            }',
              '            if (state.hasSelection()) {',
              '                drawSelectionHandles(canvas, lcd, contentTop, contentBottom);',
              '            }',
              '        }',
              '        if (structuredResult != null) {',
              '            drawStructuredApplicationResult(canvas, structuredResult, lcd,',
              '                    contentTop, contentBottom, available);',
              '        } else if (state.resultShown() && !state.result().isEmpty()) {',
          ]
          new = '\n'.join(new_lines) + '\n'
          path.write_text(text[:start] + new + text[end:], encoding='utf-8')
          PY

      - name: TABLE 显示状态回归守卫
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/src/main/java/com/codex/fx991smooth/CalculatorView.java').read_text(encoding='utf-8')
          required = [
              'boolean tableResultShown = structuredResult != null',
              'structuredResult.layout() == CnCwModeEngine.ResultLayout.TABLE',
              'if (!tableResultShown) {',
              'drawNaturalExpression(canvas, state.naturalExpression()',
              'if (structuredResult != null) {',
              'drawStructuredApplicationResult(canvas, structuredResult, lcd,'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit('TABLE 显示守卫缺失: ' + repr(missing))
          start = text.index('boolean tableResultShown = structuredResult != null')
          structured = text.index('if (structuredResult != null) {', start)
          guarded = text[start:structured]
          if 'drawNaturalExpression(canvas, state.naturalExpression()' not in guarded:
              raise SystemExit('自然表达式绘制未受 TABLE 结果守卫保护')
          if 'drawSelectionHandles(canvas, lcd, contentTop, contentBottom);' not in guarded:
              raise SystemExit('选区/光标绘制未受 TABLE 结果守卫保护')
          print('TABLE structured result owns the display; editor/cursor path is guarded.')
          PY

      - name: 恢复长期 release 签名
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.BEIBEI_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE" || { echo '缺少 BEIBEI_SIGNING_BUNDLE_B64'; exit 1; }
          SIGNING_DIR="$RUNNER_TEMP/beibei-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/beibei-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/beibei-signing.tar.gz" -C "$SIGNING_DIR"
          source "$SIGNING_DIR/signing.env"
          echo "::add-mask::$BEIBEI_STORE_PASSWORD"
          echo "::add-mask::$BEIBEI_KEY_PASSWORD"
          echo "BEIBEI_KEYSTORE_PATH=$SIGNING_DIR/beibei-release.jks" >> "$GITHUB_ENV"
          echo "BEIBEI_STORE_PASSWORD=$BEIBEI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_PASSWORD=$BEIBEI_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_ALIAS=$BEIBEI_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: 添加 Gradle 执行权限
        run: chmod +x ./gradlew

      - name: 运行完整核心回归
        run: ./gradlew :core:check

      - name: 构建 Android Debug APK
        run: ./gradlew :app:assembleCn991Debug

      - name: 构建 Release APK 并校验 R8
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleCn991Release 2>&1 | tee release-build.log
          if grep -Fq 'Invalid stack map table' release-build.log; then
            echo '检测到 R8 Invalid stack map table'
            exit 1
          fi

      - name: 校验长期签名与包名
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/cn991/release -name '*.apk' | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          ACTUAL_FP=$(printf '%s\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest' | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL_FP" = "$EXPECTED_CERT_SHA256" || { echo "签名指纹不匹配: $ACTUAL_FP"; exit 1; }
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          ACTUAL_APP_ID=$("$APKANALYZER" manifest application-id "$APK")
          test "$ACTUAL_APP_ID" = "$EXPECTED_APPLICATION_ID" || { echo "包名不匹配: $ACTUAL_APP_ID"; exit 1; }
          echo "Application ID: $ACTUAL_APP_ID"
          echo "Certificate SHA-256: $ACTUAL_FP"
          echo "SIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: 保存修复后长期签名测试 APK
        uses: actions/upload-artifact@v4
        with:
          name: stage6-table-result-fix-signed-apk
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error

      - name: 提交正式修复
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          git commit -m "fix(stage6): hide editor behind table results"
          git push origin HEAD:stage6/integration
