name: Stage 3 function Step 5 verification

on:
  push:
    branches:
      - stage3/semantic-editor
    paths:
      - tools/stage3_function_step5_patch.py
      - tools/stage3_function_step5_compat_fix.py
      - .github/workflows/stage3-function-step5.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 检出 Stage 3 分支
        uses: actions/checkout@v4
        with:
          ref: stage3/semantic-editor
          fetch-depth: 0

      - name: 配置 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 应用 Step 5 函数语义补丁
        run: |
          python tools/stage3_function_step5_patch.py
          python tools/stage3_function_step5_compat_fix.py

      - name: 添加 Gradle 执行权限
        run: chmod +x gradlew

      - name: 运行完整核心回归
        run: ./gradlew :core:check --no-daemon

      - name: 编译 Android Java
        run: ./gradlew :app:compileCn991DebugJavaWithJavac --no-daemon

      - name: 提交正式产品改动
        run: |
          git config user.name "beibei"
          git config user.email "beiming183@gmail.com"
          git add core/src/main/java/com/codex/fx991/core/cw/CnCwMachine.java \
                  core/src/regression/java/com/codex/fx991/core/CnCwCursorPathSuite.java
          if git diff --cached --quiet; then
            echo "No product changes to commit"
          else
            git commit -m "feat(stage3): add semantic function argument editing"
            git push origin HEAD:stage3/semantic-editor
          fi
