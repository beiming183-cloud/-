name: Publish 北北计算器 0.3.16

on:
  push:
    branches:
      - stage3/semantic-editor

permissions:
  contents: write

jobs:
  publish-0316:
    runs-on: ubuntu-latest
    env:
      EXPECTED_CERT_SHA256: DA6901B21ED9CCD8E33F4BFA6D2726183913F4E6C13910705E210184A17A5D33
      EXPECTED_APPLICATION_ID: com.beibei.calculator
      RELEASE_TAG: beibei-0.3.16
      RELEASE_VERSION: 0.3.16

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Refuse duplicate release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists'
            exit 1
          fi

      - name: Restore stable release signing
        shell: bash
        env:
          SIGNING_BUNDLE: ${{ secrets.BEIBEI_SIGNING_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_BUNDLE"
          SIGNING_DIR="$RUNNER_TEMP/beibei-signing"
          mkdir -p "$SIGNING_DIR"
          printf '%s' "$SIGNING_BUNDLE" | base64 -d > "$RUNNER_TEMP/beibei-signing.tar.gz"
          tar -xzf "$RUNNER_TEMP/beibei-signing.tar.gz" -C "$SIGNING_DIR"
          source "$SIGNING_DIR/signing.env"
          echo "::add-mask::$BEIBEI_STORE_PASSWORD"
          echo "::add-mask::$BEIBEI_KEY_PASSWORD"
          echo "BEIBEI_KEYSTORE_PATH=$SIGNING_DIR/beibei-release.jks" >> "$GITHUB_ENV"
          echo "BEIBEI_STORE_PASSWORD=$BEIBEI_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_PASSWORD=$BEIBEI_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "BEIBEI_KEY_ALIAS=$BEIBEI_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Core regression
        run: |
          chmod +x ./gradlew
          ./gradlew :core:check

      - name: Build release and reject R8 stack-map warning
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleCn991Release 2>&1 | tee release-build.log
          if grep -Fq 'Invalid stack map table' release-build.log; then
            echo 'R8 Invalid stack map table detected'
            exit 1
          fi

      - name: Verify stable identity and version
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/cn991/release -name '*.apk' | head -n 1)
          test -n "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          CERT_OUTPUT=$("$BUILD_TOOLS/apksigner" verify --print-certs "$APK")
          ACTUAL_FP=$(printf '%s\n' "$CERT_OUTPUT" | grep -i 'certificate SHA-256 digest' | grep -Eio '[0-9a-f]{64}' | head -n 1 | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL_FP" = "$EXPECTED_CERT_SHA256"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          ACTUAL_APP_ID=$("$APKANALYZER" manifest application-id "$APK")
          ACTUAL_VERSION_NAME=$("$APKANALYZER" manifest version-name "$APK")
          ACTUAL_VERSION_CODE=$("$APKANALYZER" manifest version-code "$APK")
          test "$ACTUAL_APP_ID" = "$EXPECTED_APPLICATION_ID"
          test "$ACTUAL_VERSION_NAME" = "$RELEASE_VERSION"
          test "$ACTUAL_VERSION_CODE" = '330'
          echo "Release certificate SHA-256: $ACTUAL_FP"
          echo "Application ID: $ACTUAL_APP_ID"
          echo "Version: $ACTUAL_VERSION_NAME ($ACTUAL_VERSION_CODE)"
          OUT="$RUNNER_TEMP/beibei-calculator-$RELEASE_VERSION-release.apk"
          cp "$APK" "$OUT"
          echo "RELEASE_APK=$OUT" >> "$GITHUB_ENV"

      - name: Upload verified release artifact
        uses: actions/upload-artifact@v4
        with:
          name: beibei-0.3.16-stable-release-apk
          path: ${{ env.RELEASE_APK }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" "$RELEASE_APK" \
            --target "$GITHUB_SHA" \
            --title '北北计算器 0.3.16' \
            --notes "北北计算器长期签名正式安装版。包含 Stage 3 语义编辑器与双变量统计 R8 stack-map 根因修复。Application ID: $EXPECTED_APPLICATION_ID；versionName: $RELEASE_VERSION；versionCode: 330；证书 SHA-256: $EXPECTED_CERT_SHA256。"
