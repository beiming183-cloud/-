name: Expand Ans process for inspection

on:
  push:
    branches: [ chat/continue-20260916 ]

permissions:
  contents: write

jobs:
  patch-test:
    if: "github.event.head_commit.message == 'ci: apply Ans process expansion'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chat/continue-20260916
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply product patch
        run: python3 tools/chat_expand_ans_process.py
      - name: Enable Gradle wrapper
        run: chmod +x ./gradlew
      - name: Verify source markers
        shell: bash
        run: |
          grep -F 'public String calculationProcessDisplay()' core/src/main/java/com/codex/fx991/core/cw/CnCwMachine.java
          grep -F 'ansProcessDisplay = evaluatedProcessDisplay;' core/src/main/java/com/codex/fx991/core/cw/CnCwMachine.java
          grep -F 'boolean showExpandedAnsProcess' app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          grep -F '已复制展开后的计算过程' app/src/main/java/com/codex/fx991smooth/CalculatorView.java
          grep -F 'ansProcessExpandsForInspection();' core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java
          grep -F 'versionCode 326' app/build.gradle
          grep -F "versionName '0.3.12'" app/build.gradle
      - name: Run full core regression
        run: ./gradlew :core:check
      - name: Compile Android Java
        run: ./gradlew :app:compileCn991DebugJavaWithJavac
      - name: Commit verified product changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/src/main/java/com/codex/fx991/core/cw/CnCwMachine.java \
                  core/src/regression/java/com/codex/fx991/core/CnCwMachineSuite.java \
                  app/src/main/java/com/codex/fx991smooth/CalculatorView.java \
                  app/build.gradle
          if git diff --cached --quiet; then
            echo 'No product changes to commit.'
            exit 0
          fi
          git commit -m "feat: expand Ans into previous calculation for inspection"
          git push origin HEAD:chat/continue-20260916
